<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dokumen Terkonfirmasi</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0fdf4;
      color: #065f46;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 4px 12px rgba(0, 128, 0, 0.1);
      text-align: center;
      max-width: 400px;
    }
    .card h1 {
      font-size: 24px;
      color: #16a34a;
    }
    .checkmark {
      font-size: 60px;
      color: #16a34a;
    }
    .note {
      margin-top: 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="checkmark">✔️</div>
    <h1>Dokumen Terkonfirmasi</h1>
    <p class="note">Dokumen ini sah dan telah diverifikasi melalui ePortal resmi.</p>
  </div>
</body>
</html>
